<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${title}</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
  <script src="https://unpkg.com/@deck.gl/carto@^9.0.0/dist.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #555;
      font-size: 14px;
    }
    #error-banner {
      display: none;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #d32f2f;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      z-index: 1000;
      max-width: 80%;
    }
    .carto-attribution {
      position: absolute;
      bottom: 4px;
      right: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      color: #666;
      background: rgba(255,255,255,0.8);
      padding: 2px 6px;
      border-radius: 3px;
      z-index: 100;
    }
    .carto-attribution a { color: #036fe2; text-decoration: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="loading">Loading map...</div>
  <div id="error-banner"></div>
  <div class="carto-attribution">
    Exported from <a href="https://carto.com" target="_blank">CARTO</a> for QGIS
  </div>
<script>
  const API_BASE_URL = '${api_base_url}';
  const ACCESS_TOKEN = '${access_token}';
  const LAYER_CONFIGS = ${layers_json};
  const VIEW_STATE = ${view_state_json};
  const BASEMAP_STYLE = '${basemap_style}';

  // Resolve accessor descriptors from Python into JS functions.
  // Descriptors are objects with a __type field ('categorized' or 'graduated').
  function resolveAccessor(desc) {
    if (!desc || typeof desc !== 'object' || !desc.__type) return desc;

    if (desc.__type === 'categorized') {
      var field = desc.field;
      var categories = desc.categories;
      var fallback = desc.default;
      return function(d) {
        var val = String(d.properties[field]);
        if (categories.hasOwnProperty(val)) return categories[val];
        return fallback;
      };
    }

    if (desc.__type === 'graduated') {
      var field = desc.field;
      var breaks = desc.breaks;
      var colors = desc.colors;
      return function(d) {
        var val = d.properties[field];
        for (var i = 0; i < breaks.length; i++) {
          if (val <= breaks[i]) return colors[i];
        }
        return colors[colors.length - 1];
      };
    }

    return desc;
  }

  // --- Gradient Fill Shader Extension ---
  // Custom deck.gl LayerExtension that renders gradient fills using GLSL shaders.
  // Supports linear, radial, and conical gradients with pad/reflect/repeat spread.
  class GradientFillExtension extends deck.LayerExtension {
    getShaders(extension) {
      // Only inject gradient into fill sub-layers, not stroke (PathLayer)
      if (this.id && this.id.indexOf('stroke') !== -1) {
        return {};
      }

      var g = (extension && extension.opts && extension.opts.gradient) || {};
      var c1 = (g.color1 || [200,200,200,255]).map(function(v) { return (v/255).toFixed(4); });
      var c2 = (g.color2 || [100,100,100,255]).map(function(v) { return (v/255).toFixed(4); });
      var gradType = g.type || 0;
      var ref1 = g.ref1 || [0.5, 0.0];
      var ref2 = g.ref2 || [0.5, 1.0];
      var angleDeg = g.angle || 0;
      var spread = g.spread || 0;

      var angleRad = angleDeg * Math.PI / 180.0;
      var dx = ref2[0] - ref1[0];
      var dy = ref2[1] - ref1[1];
      var cosA = Math.cos(angleRad);
      var sinA = Math.sin(angleRad);
      var rdx = dx * cosA - dy * sinA;
      var rdy = dx * sinA + dy * cosA;

      var spreadFn;
      if (spread === 1) {
        spreadFn = 'st = abs(mod(st + 1.0, 2.0) - 1.0);';
      } else if (spread === 2) {
        spreadFn = 'st = fract(st);';
      } else {
        spreadFn = 'st = clamp(st, 0.0, 1.0);';
      }

      // Pass viewport size from vertex shader (where project UBO is available)
      // to fragment shader via a varying.
      var fsCode;
      if (gradType === 1) {
        fsCode = '\n' +
          '  vec2 gradCenter = vec2(' + ref1[0].toFixed(4) + ', ' + ref1[1].toFixed(4) + ');\n' +
          '  vec2 screenUV = gl_FragCoord.xy / gradViewportSize_v;\n' +
          '  screenUV.y = 1.0 - screenUV.y;\n' +
          '  float st = length(screenUV - gradCenter) * 2.0;\n' +
          '  ' + spreadFn + '\n' +
          '  vec4 gc1 = vec4(' + c1.join(',') + ');\n' +
          '  vec4 gc2 = vec4(' + c2.join(',') + ');\n' +
          '  color = mix(gc1, gc2, st);\n';
      } else if (gradType === 2) {
        fsCode = '\n' +
          '  vec2 gradCenter = vec2(' + ref1[0].toFixed(4) + ', ' + ref1[1].toFixed(4) + ');\n' +
          '  vec2 screenUV = gl_FragCoord.xy / gradViewportSize_v;\n' +
          '  screenUV.y = 1.0 - screenUV.y;\n' +
          '  float st = atan(screenUV.y - gradCenter.y, screenUV.x - gradCenter.x) / (2.0 * 3.14159) + 0.5;\n' +
          '  st = st + ' + (angleDeg / 360.0).toFixed(4) + ';\n' +
          '  ' + spreadFn + '\n' +
          '  vec4 gc1 = vec4(' + c1.join(',') + ');\n' +
          '  vec4 gc2 = vec4(' + c2.join(',') + ');\n' +
          '  color = mix(gc1, gc2, st);\n';
      } else {
        fsCode = '\n' +
          '  vec2 gradDir = vec2(' + rdx.toFixed(6) + ', ' + rdy.toFixed(6) + ');\n' +
          '  vec2 gradOrigin = vec2(' + ref1[0].toFixed(4) + ', ' + ref1[1].toFixed(4) + ');\n' +
          '  vec2 screenUV = gl_FragCoord.xy / gradViewportSize_v;\n' +
          '  screenUV.y = 1.0 - screenUV.y;\n' +
          '  float gradLen = max(length(gradDir), 0.001);\n' +
          '  vec2 gradNorm = gradDir / gradLen;\n' +
          '  float st = dot(screenUV - gradOrigin, gradNorm) / gradLen;\n' +
          '  ' + spreadFn + '\n' +
          '  vec4 gc1 = vec4(' + c1.join(',') + ');\n' +
          '  vec4 gc2 = vec4(' + c2.join(',') + ');\n' +
          '  color = mix(gc1, gc2, st);\n';
      }

      return {
        inject: {
          'vs:#decl': 'out vec2 gradViewportSize_v;\n',
          'fs:#decl': 'in vec2 gradViewportSize_v;\n',
          'vs:DECKGL_FILTER_GL_POSITION': '  gradViewportSize_v = project.viewportSize;\n',
          'fs:DECKGL_FILTER_COLOR': fsCode
        }
      };
    }
  }

  function showError(msg) {
    var banner = document.getElementById('error-banner');
    banner.textContent = msg;
    banner.style.display = 'block';
  }

  async function initMap() {
    try {
      var layers = [];

      for (var i = 0; i < LAYER_CONFIGS.length; i++) {
        var config = LAYER_CONFIGS[i];
        try {
          var source = await deck.carto.vectorTableSource({
            accessToken: ACCESS_TOKEN,
            apiBaseUrl: API_BASE_URL,
            connectionName: config.connection,
            tableName: config.tableName,
          });

          var layerProps = {
            id: config.id,
            data: source,
            opacity: config.opacity !== undefined ? config.opacity : 1,
            pickable: true,
          };

          // Accessor props — resolve descriptors into functions
          var accessorProps = ['getFillColor', 'getLineColor', 'getColor',
                               'getLineWidth', 'getWidth', 'getPointRadius'];
          for (var j = 0; j < accessorProps.length; j++) {
            var prop = accessorProps[j];
            if (config[prop] !== undefined) layerProps[prop] = resolveAccessor(config[prop]);
          }
          // Static props
          if (config.lineWidthMinPixels !== undefined) layerProps.lineWidthMinPixels = config.lineWidthMinPixels;
          if (config.widthMinPixels !== undefined) layerProps.widthMinPixels = config.widthMinPixels;
          if (config.pointRadiusMinPixels !== undefined) layerProps.pointRadiusMinPixels = config.pointRadiusMinPixels;

          // Gradient fill extension
          if (config.gradient) {
            layerProps.extensions = [new GradientFillExtension({gradient: config.gradient})];
          }

          layers.push(new deck.carto.VectorTileLayer(layerProps));
        } catch (layerErr) {
          console.error('Failed to load layer: ' + config.name, layerErr);
        }
      }

      document.getElementById('loading').style.display = 'none';

      new deck.DeckGL({
        container: 'map',
        mapStyle: BASEMAP_STYLE,
        initialViewState: VIEW_STATE,
        controller: true,
        layers: layers,
      });
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      showError('Failed to initialize map: ' + err.message);
      console.error(err);
    }
  }

  initMap();
</script>
</body>
</html>
